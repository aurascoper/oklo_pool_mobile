name: OkloPool
options:
  bundleIdPrefix: org.oklo
  deploymentTarget:
    iOS: "17.0"
packages:
  OkloCoreKit:
    path: OkloCoreKit
targets:
  OkloPool:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OkloPool
        excludes:
          - "PrivacyInfo.xcprivacy"
      - path: OkloPool/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: OkloCoreKit
        product: OkloCore
    settings:
      base:
        PRODUCT_NAME: OkloPool
        PRODUCT_BUNDLE_IDENTIFIER: org.oklo.pool
        SWIFT_VERSION: "6.0"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Oklo Pool"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: "AccentColor"
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": "x86_64"

  OkloPoolTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OkloPoolTests
    dependencies:
      - target: OkloPool
      - package: OkloCoreKit
        product: OkloCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.oklo.pool.tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OkloPool.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/OkloPool"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": "x86_64"

  OkloPoolUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OkloPoolUITests
    dependencies:
      - target: OkloPool
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.oklo.pool.uitests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: OkloPool
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": "x86_64"
